    <script>
      (function() {
        function shouldSuppress(msg, src) {
          if (!msg || msg === 'Script error.' || msg === 'Script error' || String(msg).indexOf('Script error') !== -1) return true;
          if (src && (src.indexOf('disqus') !== -1 || src.indexOf('disquscdn') !== -1)) return true;
          return false;
        }

        var origOnError = window.onerror;
        window.onerror = function(msg, url, line, col, err) {
          if (shouldSuppress(msg, url)) {
            return true;
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('error', function(event) {
          if (shouldSuppress(event.message, event.filename)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = (event && event.reason) ? (event.reason.message || String(event.reason)) : '';
          if (shouldSuppress(reasonStr, '')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
